{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Brissy Parker</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- OUR CSS -->
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      /* TOP BANNER */

      .hero {
        width: 100%;
        padding: 32px 20px;

        text-align: center;

        background-color: #88e788;
        color: #000000;
      }

      .hero h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
      }

      .hero p {
        margin: 8px 0 0;
        font-size: 14px;
        color: #000000;
      }
      form {
        width: 70%;
        margin: 24px auto;
        padding: 20px;

        background-color: white;
        border-radius: 12px;

        display: flex;
        align-items: end;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      form div {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      form label {
        font-size: 13px;
        font-weight: 600;
        color: #333;
      }

      form input,
      form select {
        height: 40px;
        padding: 0 12px;

        background-color: white;

        border: 1px solid #cccccc;
        border-radius: 7px;

        font-size: 14px;
      }

      form input {
        min-width: 220px;
      }

      form input:focus,
      form select:focus {
        outline: 2px solid #88e788;
        border-color: #88e788;
      }

      /* FIND PARKING BUTTON */

      form button {
        height: 40px;
        padding: 0 20px;

        background-color: #222222;
        color: white;

        border: none;
        border-radius: 7px;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
      }

      form button:hover {
        background-color: #444444;
      }

      .address-field {
        position: relative;
      }

      #address-suggestions {
        position: absolute;
        top: 100%;
        left: 0;

        width: 320px;
        max-height: 220px;
        overflow-y: auto;

        background-color: white;

        border: 1px solid #ddd;
        border-radius: 7px;

        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);

        z-index: 2000;
      }

      .suggestion {
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.3;

        cursor: pointer;

        border-bottom: 1px solid #eee;
      }

      .suggestion:last-child {
        border-bottom: none;
      }

      .suggestion:hover {
        background-color: #f2f2f2;
      }

      /* MAP */

      #map {
        height: 450px;
        width: 70%;
        margin: 20px auto;
      }
    </style>
  </head>

  <body>
    <!-- TOP BANNER -->

    <header class="hero">
      <h1>The Brissy Parker</h1>

      <p>
        Find parking that matches your destination, walking distance and
        required stay.
      </p>
    </header>

    <form
      method="get"
      action="{% url 'search' %}"
      hx-get="{% url 'search' %}"
      hx-target="#search-results"
      hx-swap="innerHTML"
      hx-indicator="#loading"
    >
      <div class="address-field">
        <label for="destination">Destination</label>

        <input
          type="text"
          id="destination"
          name="destination"
          placeholder="Start typing an address..."
          autocomplete="off"
          required
        />

        <div id="address-suggestions"></div>
      </div>

      <div>
        <label for="radius">Maximum walking distance</label>

        <select id="radius" name="radius">
          <option value="250">250 m</option>
          <option value="500">500 m</option>
          <option value="750">750 m</option>
          <option value="1000" selected>1 km</option>
          <option value="1500">1.5 km</option>
        </select>
      </div>

      <div>
        <label for="required_stay">Parking duration</label>

        <select id="required_stay" name="required_stay">
          <option value="1">1 hour</option>
          <option value="2">2 hours</option>
          <option value="3" selected>3 hours</option>
          <option value="4">4 hours</option>
          <option value="7">7 hours</option>
          <option value="12">12 hours</option>
        </select>
      </div>

      <div>
        <label for="sort_by">Sort by</label>

        <select id="sort_by" name="sort_by">
          <option value="best">Best match</option>
          <option value="price">Lowest price</option>
          <option value="distance">Closest</option>
          <option value="stay">Longest stay</option>
        </select>
      </div>

      <button type="submit">Find Parking</button>
    </form>

    <!-- MAP -->

    <div id="map"></div>

    <!-- LOADING -->

    <p id="loading" class="htmx-indicator">Finding parking...</p>

    <!-- RESULTS -->

    <div id="search-results"></div>

    <!-- MAP SETUP -->

    <script>
      const map = L.map("map").setView([-27.4698, 153.0251], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
    </script>
    <script>
      const destinationInput = document.getElementById("destination");

      const suggestionsBox = document.getElementById("address-suggestions");

      let autocompleteTimer;

      destinationInput.addEventListener("input", function () {
        clearTimeout(autocompleteTimer);

        const query = this.value.trim();

        if (query.length < 3) {
          suggestionsBox.innerHTML = "";
          return;
        }

        autocompleteTimer = setTimeout(async () => {
          try {
            const response = await fetch(
              `/autocomplete/?q=${encodeURIComponent(query)}`
            );

            const data = await response.json();

            suggestionsBox.innerHTML = "";

            data.results.forEach((result) => {
              const suggestion = document.createElement("div");

              suggestion.className = "suggestion";
              suggestion.textContent = result.display_name;

              suggestion.addEventListener("click", function () {
                destinationInput.value = result.display_name;

                suggestionsBox.innerHTML = "";
              });

              suggestionsBox.appendChild(suggestion);
            });
          } catch (error) {
            console.error("Autocomplete failed:", error);
          }
        }, 250);
      });

      document.addEventListener("click", function (event) {
        if (
          !destinationInput.contains(event.target) &&
          !suggestionsBox.contains(event.target)
        ) {
          suggestionsBox.innerHTML = "";
        }
      });
    </script>
  </body>
</html>
